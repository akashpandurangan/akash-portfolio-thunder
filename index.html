    <script>
      // Apply a saved theme before first paint to avoid a flash of the default (dark) theme.
      try {
        if (localStorage.getItem('ap-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (error) {
        /* storage unavailable */
      }
